name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    # The Linux sandbox is the default execution boundary, so CI must actually
    # be able to create a user namespace. Ubuntu 24.04 restricts unprivileged
    # user namespaces through AppArmor; the step below opens them for this
    # ephemeral runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the sandbox backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces
        run: |
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true
      - name: Provider catalog sync tests
        run: python3 -m unittest scripts.test_sync_provider_catalog
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: nextest@0.9.140
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      # Every sandbox test soft-skips when the backend is unavailable, so
      # without this the suite could pass while testing nothing.
      - name: The sandbox backend is actually enforced here
        run: |
          cargo run --locked -p euler-cli -- --check-sandbox
      - name: Test
        run: cargo nextest run --workspace
      - name: Doc tests
        run: cargo test --workspace --doc

  sandbox-unavailable:
    # A host that cannot create a user namespace must produce Euler's
    # actionable diagnostic, not a raw Bubblewrap failure (ADR 0021 row A').
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-sandbox-unavailable-${{ hashFiles('Cargo.lock') }}
      - name: Install the sandbox backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Build the CLI
        run: cargo build --locked -p euler-cli
      - name: Restrict unprivileged user namespaces
        run: |
          sudo sysctl -w user.max_user_namespaces=0
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: The probe reports an actionable cause, not a bwrap error
        run: |
          set +e
          ./target/debug/euler --check-sandbox >probe.out 2>probe.err
          status=$?
          set -e
          cat probe.out probe.err
          test "$status" -ne 0
          grep -qx 'sandbox backend: unavailable' probe.out
          grep -q 'workspace probed: ' probe.out
          # Order-independent: the classification may name the sysctl or
          # AppArmor, but it must always name a cause and a way out.
          grep -qE 'user namespaces are disabled|AppArmor restricts' probe.err
          grep -q 'To fix it: ' probe.err
          grep -q 'sysctl' probe.err
          grep -q 'fail closed' probe.err
          ! grep -qi 'bwrap:' probe.err
      - name: A sandbox-requiring tool fails closed rather than running on the host
        run: |
          cat >script.json <<'JSON'
          {"version": 1, "responses": [
            {"events": [
              {"tool_call": {"id": "c1", "name": "run_shell",
                             "input": {"command": "printf escaped > escaped.txt"}}},
              {"finished": {"stop_reason": "tool_use"}}]},
            {"events": [{"text_delta": "done"}, {"finished": {"stop_reason": "completed"}}]}]}
          JSON
          mkdir -p fail-closed && cd fail-closed
          ../target/debug/euler exec --provider fixture \
            --provider-option "event-script=$PWD/../script.json" \
            --extensions none --project-context off --auto-approve trusted-local \
            --provenance events.jsonl "run a shell command"
          cat events.jsonl
          grep -q '"sandbox_backend":"unavailable"' events.jsonl
          # The command must not have run on the host instead.
          test ! -e escaped.txt
